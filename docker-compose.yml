services:
  db:
    image: postgres:15-alpine
    container_name: scm_website_db
    environment:
      POSTGRES_DB: KLTN
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
    ports:
      - "5432:5432"
    volumes:
      - scm_postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: scm_website_container
    command: sh -c "sleep 8 && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - scm_media_data:/app/media
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: on-failure
    environment:
      - PYTHONUNBUFFERED=1
      - DB_NAME=KLTN
      - DB_USER=postgres
      - DB_PASSWORD=123
      - DB_HOST=db
      - DB_PORT=5432

volumes:
  scm_postgres_data:
  scm_media_data: